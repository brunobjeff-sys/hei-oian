
<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hei Oihan 💗</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ffe0ec, #f8c8dc, #fff0f5);
    }

    .card {
      background: white;
      width: min(90%, 440px);
      padding: 38px 22px;
      border-radius: 28px;
      text-align: center;
      box-shadow: 0 12px 40px #d86b9533;
    }

    .emoji {
      font-size: 65px;
    }

    h1 {
      color: #e75480;
      font-size: 30px;
    }

    p {
      font-size: 18px;
      color: #555;
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 18px;
      margin-top: 28px;
      min-height: 60px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 15px 25px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    #yes {
      background: #e75480;
      color: white;
    }

    #no {
      background: #eeeeee;
      color: #444;
      transition: left 0.12s, top 0.12s;
      z-index: 10;
    }

    #message {
      color: #e75480;
      font-weight: bold;
      margin-top: 24px;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="emoji">🎧💗</div>

    <h1>Hei Oihan!</h1>

    <p>
      Vil du gi meg AirPodsa du vant? :D
      <br>
      <small>(ærlig svar)</small>
    </p>

    <div class="buttons">
      <button id="yes" onclick="sayYes()">JA 💖</button>
      <button id="no">NEI 🙄</button>
    </div>

    <div id="message"></div>
  </main>

  <script>
    const noButton = document.getElementById("no");

    function runAway() {
      const padding = 12;

      const maxX = window.innerWidth - noButton.offsetWidth - padding;
      const maxY = window.innerHeight - noButton.offsetHeight - padding;

      const x = padding + Math.random() * Math.max(0, maxX - padding);
      const y = padding + Math.random() * Math.max(0, maxY - padding);

      noButton.style.position = "fixed";
      noButton.style.left = x + "px";
      noButton.style.top = y + "px";
    }

    // Flytt NEI når musa nærmer seg
    noButton.addEventListener("pointerenter", runAway);

    // Flytt NEI når noen prøver å trykke på mobil
    noButton.addEventListener("touchstart", (event) => {
      event.preventDefault();
      runAway();
    }, { passive: false });

    // Ekstra sikkerhet hvis NEI likevel blir trykket
    noButton.addEventListener("click", (event) => {
      event.preventDefault();
      runAway();
    });

    function sayYes() {
      document.querySelector(".emoji").textContent = "🥹💗🎧";

      document.querySelector("h1").textContent =
        "HAHAHA JAAA!";

      document.querySelector("p").textContent =
        "Takk Oihan, jeg visste du ville si ja 😭💕";

      document.getElementById("message").textContent =
        "Du har offisielt valgt riktig svar 😂💗";

      noButton.style.display = "none";
    }
  </script>
</body>
</html>
